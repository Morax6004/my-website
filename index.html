<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 我的个人网站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overlay"></div>
  <div id="welcome-popup">
    <div class="emoji">😊</div>
    <div class="message">欢迎来到我的世界</div>
  </div>

  <header>
    <nav>
      <div class="logo">MySite</div>
      <ul class="nav-links">
        <li><a href="index.html"><img src="图标/nav-home.png" alt="首页" class="nav-icon">首页</a></li>
        <li><a href="about.html"><img src="图标/nav-individual.png" alt="关于我" class="nav-icon">关于我</a></li>

      </ul>
    </nav>

  <main>
    <div class="page">
      <section class="hero container">
        <div class="hero-image">
          <img src="images/avatar.jpg" alt="个人头像" onerror="this.style.display='none'; this.parentElement.innerHTML='👤';">
        </div>
        <div class="hero-content">
          <h1>你好，我是<span>kahran</span></h1>

          <a href="about.html" class="btn">了解更多</a>

    </div>

  <footer>
    <p>&copy; 2026 我的个人网站. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>

</html>
